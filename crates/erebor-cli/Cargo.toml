[package]
name = "erebor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Erebor command line: status, diagnostics, mining control, agent and TUI"

[[bin]]
name = "erebor"
path = "src/main.rs"

[dependencies]
erebor-core = { path = "../erebor-core" }
erebor-agent = { path = "../erebor-agent" }
erebor-tui = { path = "../erebor-tui" }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dialoguer = { version = "0.11", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
