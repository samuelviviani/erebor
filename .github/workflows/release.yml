name: Release (manual)

# Explicit, manual workflow. It builds installers and creates a DRAFT GitHub release:
# a maintainer reviews hashes and notes, then publishes it by hand.
#
# Secrets (Settings › Secrets › Actions):
#   EREBOR_DEV_FEE_WALLET  public Monero address of the project (optional; without it
#                          the build applies no Erebor fee and says so in the UI)
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#                          signs the update bundles and latest.json (see docs/RELEASE.md)
# Variables: EREBOR_REPO_URL (shown in the About section)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match tauri.conf.json, e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify version
        shell: bash
        run: |
          grep -q "\"version\": \"${{ inputs.version }}\"" apps/desktop/src-tauri/tauri.conf.json
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EREBOR_DEV_FEE_WALLET: ${{ secrets.EREBOR_DEV_FEE_WALLET }}
          EREBOR_REPO_URL: ${{ vars.EREBOR_REPO_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: v${{ inputs.version }}
          releaseName: Erebor v${{ inputs.version }}
          releaseBody: "Draft: add changelog and verify SHA-256 hashes before publishing."
          releaseDraft: true
          # Installed apps update from /releases/latest, which skips pre-releases.
          prerelease: false

  # The `erebor` terminal program: one binary per OS/CPU, signed with the same key as
  # the desktop updater. Installed CLIs update themselves from these assets.
  cli:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: erebor-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: erebor-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: erebor-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: erebor-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        env:
          EREBOR_DEV_FEE_WALLET: ${{ secrets.EREBOR_DEV_FEE_WALLET }}
          EREBOR_REPO_URL: ${{ vars.EREBOR_REPO_URL }}
        run: |
          cargo build --release --locked -p erebor-cli --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/erebor ${{ matrix.asset }}
      - name: Sign and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2.12.4 signer sign ${{ matrix.asset }}
          gh release upload "v${{ inputs.version }}" ${{ matrix.asset }} ${{ matrix.asset }}.sig --repo "${{ github.repository }}" --clobber

  checksums:
    needs: [build, cli]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish SHA256SUMS to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dl && cd dl
          gh release download "v${{ inputs.version }}" --repo "${{ github.repository }}"
          sha256sum * > SHA256SUMS
          gh release upload "v${{ inputs.version }}" SHA256SUMS --repo "${{ github.repository }}" --clobber
